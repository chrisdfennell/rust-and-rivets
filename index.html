<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Mobile viewport: prevent pinch-zoom (game canvas handles its own
      scaling) and let the page extend behind iPhone notches.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rust &amp; Rivets" />
    <meta name="theme-color" content="#14110f" />
    <!--
      PWA installability — links to manifest + icon for "Add to Home
      Screen" support across iOS / Android / desktop browsers.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Rust &amp; Rivets</title>
    <style>
      /* Keep html/body at full viewport with NO padding so the #game
         div can claim 100vw / 100vh cleanly. Earlier safe-area
         padding here was shifting the canvas off-center on desktop. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #14110f;
        color: #d9c9a3;
        font-family: 'Courier New', monospace;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Use viewport units so #game is always exactly the actual
         viewport, regardless of any future body styling. */
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }

      /* Slice 59 — the portrait-rotate overlay was removed when the
         responsive scenes (Title, CharacterSelect, Combat) gained
         their own portrait layouts. Other scenes still letterbox via
         applyDesignFit but the game is playable in portrait. */
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
