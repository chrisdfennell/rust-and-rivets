<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Mobile viewport: prevent pinch-zoom (game canvas handles its own
      scaling) and let the page extend behind iPhone notches.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rust &amp; Rivets" />
    <meta name="theme-color" content="#14110f" />
    <!--
      PWA installability — links to manifest + icon for "Add to Home
      Screen" support across iOS / Android / desktop browsers.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Rust &amp; Rivets</title>
    <style>
      /* Keep html/body at full viewport with NO padding so the #game
         div can claim 100vw / 100vh cleanly. Earlier safe-area
         padding here was shifting the canvas off-center on desktop. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #14110f;
        color: #d9c9a3;
        font-family: 'Courier New', monospace;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Use viewport units so #game is always exactly the actual
         viewport, regardless of any future body styling. */
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }

      /*
        Portrait-mode rotation. The 1280×720 game is designed for
        landscape; on a portrait viewport, FIT mode would shrink it
        into a tiny letterboxed strip in the middle. Instead, we
        present the game ROTATED 90° so it fills the portrait screen
        as a landscape image — the user holds their phone normally
        and sees the full game without having to physically tilt it.

        - The #game div is sized to (viewport-H × viewport-W) — i.e.
          swapped dimensions — so once rotated it covers the viewport.
        - The rotation origin is the top-left; the translate then
          shifts it back onto the visible area.
        - Phaser inside sees a wide canvas, so its scenes lay out
          normally in landscape.
        - Modern browsers correctly route pointer events through the
          CSS transform, so touch input lands on the right pixel.

        Gated on max-width: 900px so desktop browsers narrowed for
        testing stay in normal orientation.
      */
      @media (orientation: portrait) and (max-width: 900px) {
        #game {
          width: 100vh;
          height: 100vw;
          transform-origin: 0 0;
          transform: rotate(90deg) translateY(-100%);
        }
        /* Hint pinned to a corner (no transform) so the player learns
           they can rotate their phone for a "native" landscape view if
           they prefer. Position is in the BROWSER viewport, not the
           transformed canvas, so it stays readable. */
        body::after {
          content: 'Rotate your phone for a landscape view';
          position: fixed;
          left: 8px;
          bottom: 8px;
          font-size: 10px;
          font-family: 'Courier New', monospace;
          color: #8a7d5e;
          background: rgba(20, 17, 15, 0.7);
          padding: 4px 8px;
          border-radius: 3px;
          pointer-events: none;
          z-index: 999;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
