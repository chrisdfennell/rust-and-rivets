<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Mobile viewport: prevent pinch-zoom (game canvas handles its own
      scaling) and let the page extend behind iPhone notches.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rust &amp; Rivets" />
    <meta name="theme-color" content="#14110f" />
    <!--
      PWA installability — links to manifest + icon for "Add to Home
      Screen" support across iOS / Android / desktop browsers.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Rust &amp; Rivets</title>
    <style>
      /* Keep html/body at full viewport with NO padding so the #game
         div can claim 100vw / 100vh cleanly. Earlier safe-area
         padding here was shifting the canvas off-center on desktop. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #14110f;
        color: #d9c9a3;
        font-family: 'Courier New', monospace;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Use viewport units so #game is always exactly the actual
         viewport, regardless of any future body styling. */
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }

      /*
        Portrait mode. The 1280×720 design is fundamentally landscape,
        so portrait phones letterbox heavily. Rather than auto-rotate
        the canvas (touch events get messy and "sideways game" reads
        wrong), surface a CLEAR full-screen hint asking the player to
        rotate their phone. The PWA manifest already declares
        orientation: landscape; this is the in-browser fallback.

        Gated on max-width: 900px so desktop browsers narrowed for
        testing don't get the overlay.
      */
      @media (orientation: portrait) and (max-width: 900px) {
        #portrait-overlay {
          display: flex;
        }
      }
      #portrait-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(20, 17, 15, 0.92);
        color: #d9c9a3;
        font-family: 'Courier New', monospace;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #portrait-overlay .glyph {
        font-size: 64px;
        color: #b88a3e;
        margin-bottom: 16px;
        display: inline-block;
        animation: spin-hint 3s ease-in-out infinite;
      }
      #portrait-overlay .title {
        font-size: 22px;
        font-weight: bold;
        color: #b88a3e;
        margin-bottom: 12px;
        letter-spacing: 1px;
      }
      #portrait-overlay .sub {
        font-size: 13px;
        line-height: 1.5;
        color: #8a7d5e;
        max-width: 320px;
      }
      @keyframes spin-hint {
        0%, 100% { transform: rotate(0deg); }
        50%      { transform: rotate(90deg); }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="portrait-overlay" aria-hidden="true">
      <div class="glyph">↻</div>
      <div class="title">ROTATE YOUR PHONE</div>
      <div class="sub">Rust &amp; Rivets is laid out for landscape.
        Turn your phone sideways and you're set.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
